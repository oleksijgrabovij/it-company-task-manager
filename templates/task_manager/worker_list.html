{% extends "base.html" %}

{% block content %}
    <div class="mb-4">
        <h2>Список працівників</h2>
    </div>
    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>ПІБ</th>
                <th>Посада</th>
            </tr>
        </thead>
        <tbody>
            {% for worker in worker_list %}
                <tr>
                    <td>{{ worker.id }}</td>
                    <td>{{ worker.username }}</td>
                    <td>{{ worker.first_name }} {{ worker.last_name }}</td>
                    <td>{{ worker.position.name|default:"Без посади" }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
