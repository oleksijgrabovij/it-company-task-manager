{% extends "base.html" %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm mt-4 border-danger">
                <div class="card-body text-center">
                    <h2 class="text-danger mb-4">Підтвердження видалення</h2>
                    <p>Ви дійсно хочете видалити посаду <strong>"{{ position.name }}"</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Так, видалити</button>
                        <a href="{% url 'task_manager:position-list' %}" class="btn btn-secondary">Скасувати</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
