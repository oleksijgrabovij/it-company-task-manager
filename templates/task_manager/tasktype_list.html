{% extends "base.html" %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Типи завдань</h2>
        <a href="{% url 'task_manager:tasktype-create' %}" class="btn btn-primary">+ Створити тип</a>
    </div>

    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Назва</th>
                <th class="text-end">Дії</th>
            </tr>
        </thead>
        <tbody>
            {% for tasktype in tasktype_list %}
                <tr>
                    <td>{{ tasktype.id }}</td>
                    <td>{{ tasktype.name }}</td>
                    <td class="text-end">
                        <a href="{% url 'task_manager:tasktype-update' pk=tasktype.id %}" class="btn btn-sm btn-outline-secondary">Редагувати</a>
                        <a href="{% url 'task_manager:tasktype-delete' pk=tasktype.id %}" class="btn btn-sm btn-outline-danger">Видалити</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    {% include "includes/pagination.html" %}
{% endblock %}
