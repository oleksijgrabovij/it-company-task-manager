{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm mt-4">
                <div class="card-body">
                    <h2 class="mb-4">
                        {% if object %}
                            Редагувати завдання
                        {% else %}
                            Створити нове завдання
                        {% endif %}
                    </h2>
                    <form method="post">
                        {% csrf_token %}

                        {{ form|crispy }}

                        <div class="mt-4">
                            <button type="submit" class="btn btn-success">Зберегти</button>
                            <a href="{% url 'task_manager:task-list' %}" class="btn btn-secondary">Скасувати</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
