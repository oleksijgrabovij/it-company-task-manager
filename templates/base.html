<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'task_manager:index' %}">IT Task Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'task_manager:index' %}">Дашборд</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'task_manager:task-list' %}">Завдання</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'task_manager:worker-list' %}">Працівники</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'task_manager:position-list' %}">Посади</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'task_manager:task-type-list' %}">Типи завдань</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item d-flex align-items-center">
                            <span class="text-light me-3">Привіт, {{ user.username }}!</span>
                        </li>
                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <input type="hidden" name="next" value="/">
                                <button type="submit" class="btn btn-outline-light btn-sm">Вийти</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link btn btn-primary text-white btn-sm px-3" href="{% url 'login' %}">Увійти</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Саме сюди буде підставлятися унікальний код з інших сторінок -->
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
